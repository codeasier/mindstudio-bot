name: ✨ 功能需求
description: 提出新的自动化能力或对现有行为的改进建议
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        请先说明要解决的问题，再描述期望的方案，便于判断优先级与边界。
  - type: textarea
    id: background
    attributes:
      label: 使用场景与问题
      description: 当前遇到了什么不便？在什么流程中出现？
      placeholder: 描述场景、频率与影响
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的方案
      description: 希望机器人怎样处理？触发条件、动作与结果分别是什么
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 涉及范围
      multiple: true
      options:
        - Issue 处理
        - PR 处理
        - 规则与配置
        - 部署与运维
        - 文档
        - 其他
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 是否考虑过其他做法？为什么不用
  - type: textarea
    id: additional
    attributes:
      label: 补充说明
